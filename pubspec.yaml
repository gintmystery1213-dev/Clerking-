name: cler_app
description: CLER / ClerkAI — Offline Clinical Reasoning Simulator for Android & iOS
publish_to: 'none'
version: 2.2.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  google_fonts: ^6.2.1
  intl: ^0.19.0
  http: ^1.2.2
  connectivity_plus: ^6.0.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/knowledge/peds_knowledge_bank.json
    - assets/knowledge/intent_embeddings.json
    - assets/knowledge/models/minilm_static_96.vocab
    - assets/knowledge/models/minilm_static_96.vec.zlib
    - assets/knowledge/models/intent_static_96.json
    - assets/knowledge/cases/peds_cases.json
